<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skademelding – Telenor</title>
    <style>
        :root { --bg: #f4f6f8; --card: #fff; --primary: #0b5cad; --border: #d7dde3; --text: #1b2733; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 680px; margin: 32px auto; padding: 0 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        h1 { font-size: 1.5rem; margin: 0 0 4px; }
        .subtitle { color: #5a6b7b; margin: 0 0 20px; }
        label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; }
        select, textarea, input[type=text], input[type=password], input[type=file] {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; background: #fff;
        }
        textarea { min-height: 96px; resize: vertical; }
        button { background: var(--primary); color: #fff; border: 0; border-radius: 6px; padding: 11px 18px; font-size: .95rem; cursor: pointer; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .row { display: flex; gap: 16px; }
        .row > div { flex: 1; }
        .status { padding: 12px; border-radius: 6px; margin-top: 16px; font-size: .9rem; display: none; }
        .status.ok { background: #e6f4ea; color: #1e7e34; display: block; }
        .status.err { background: #fdecea; color: #b4231a; display: block; }
        .ref { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
        .pill { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #eef3f8; color: #4a5a6a; }
        .muted { color: #7a8a99; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Meld skade</h1>
            <p class="subtitle">Registrer informasjon om skaden og få et saksnummer.</p>
            <span class="pill" id="authState">Ikke innlogget</span>
        </div>

        <form id="claimForm" class="card">
            <div class="row">
                <div>
                    <label for="damageType">Skadetype *</label>
                    <select id="damageType" required></select>
                </div>
                <div>
                    <label for="damageCause">Skadeårsak *</label>
                    <select id="damageCause" required></select>
                </div>
            </div>

            <label for="summary">Detaljert beskrivelse av hendelsen *</label>
            <textarea id="summary" placeholder="Beskriv hva som skjedde, når og hvor..." required></textarea>

            <label for="damageImages">Bilder av skadestedet</label>
            <input type="file" id="damageImages" accept="image/*" multiple />
            <span class="muted">JPEG, PNG, WEBP eller GIF. Maks 10 MB per fil.</span>

            <label for="repairFiles">Filer etter reparasjon</label>
            <input type="file" id="repairFiles" accept="image/*,application/pdf" multiple />
            <span class="muted">Bilder eller PDF. Maks 10 MB per fil.</span>

            <div style="margin-top: 20px;">
                <button type="submit" id="submitBtn">Send skademelding</button>
            </div>

            <div class="status" id="status"></div>
        </form>
    </div>

    <script>
        // Testbruker – API-et er beskyttet med JWT bearer-autentisering.
        const TEST_USER = { username: "test", password: "test" };
        let token = null;

        const $ = (id) => document.getElementById(id);
        const statusEl = $("status");

        // Builds content with textContent only, so server/user text is never parsed as HTML.
        function showStatus(message, ok, details) {
            statusEl.className = "status " + (ok ? "ok" : "err");
            statusEl.replaceChildren(document.createTextNode(message));
            for (const [label, value] of details || []) {
                const line = document.createElement("div");
                line.append(label + ": ");
                const strong = document.createElement("span");
                strong.className = "ref";
                strong.textContent = value;
                line.append(strong);
                statusEl.append(line);
            }
        }

        async function problemMessage(res) {
            const problem = await res.json().catch(() => null);
            if (!problem) return res.status + " " + res.statusText;
            if (problem.errors) return Object.values(problem.errors).flat().join(" ");
            return problem.detail || problem.title || "Forespørselen feilet";
        }

        async function login() {
            const res = await fetch("/api/auth/token", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(TEST_USER)
            });
            if (!res.ok) throw new Error("Innlogging feilet");
            const data = await res.json();
            token = data.accessToken;
            $("authState").textContent = "Innlogget som " + TEST_USER.username;
        }

        async function loadLookup(url, selectEl) {
            const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
            if (!res.ok) throw new Error("Kunne ikke laste " + url);
            const items = await res.json();
            selectEl.innerHTML = "";
            for (const item of items) {
                const opt = document.createElement("option");
                opt.value = item.id;
                opt.textContent = item.name;
                selectEl.appendChild(opt);
            }
        }

        async function init() {
            try {
                await login();
                await Promise.all([
                    loadLookup("/api/damage-types", $("damageType")),
                    loadLookup("/api/damage-causes", $("damageCause"))
                ]);
            } catch (err) {
                showStatus("Feil ved oppstart: " + err.message, false);
            }
        }

        $("claimForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            $("submitBtn").disabled = true;
            statusEl.className = "status";

            try {
                const form = new FormData();
                form.append("damageTypeId", $("damageType").value);
                form.append("damageCauseId", $("damageCause").value);
                form.append("summary", $("summary").value);
                for (const f of $("damageImages").files) form.append("damageImages", f);
                for (const f of $("repairFiles").files) form.append("repairFiles", f);

                const res = await fetch("/api/claims", {
                    method: "POST",
                    headers: { Authorization: "Bearer " + token },
                    body: form
                });

                if (!res.ok) {
                    throw new Error(await problemMessage(res));
                }

                const claim = await res.json();
                showStatus("Skademeldingen er sendt inn.", true, [
                    ["Saks-ID", claim.id],
                    ["Referanse", claim.reference],
                    ["Vedlegg", String(claim.attachments.length)]
                ]);
                e.target.reset();
            } catch (err) {
                showStatus("Feil: " + err.message, false);
            } finally {
                $("submitBtn").disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
